<style>
:root{
  --ui-bg:#f3f5f8; --ui-surface:#ffffff; --ui-ink:#18212e; --ui-muted:#5b6778; --ui-line:#d9dfe7; --ui-accent:#1f4e79; --ui-accent-ink:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ color-scheme:dark; --ui-bg:#11161d; --ui-surface:#19202a; --ui-ink:#e7ecf3; --ui-muted:#9aa6b6; --ui-line:#2c3542; --ui-accent:#8fb8e3; --ui-accent-ink:#0e1520; }
}
:root[data-theme="dark"]{ color-scheme:dark; --ui-bg:#11161d; --ui-surface:#19202a; --ui-ink:#e7ecf3; --ui-muted:#9aa6b6; --ui-line:#2c3542; --ui-accent:#8fb8e3; --ui-accent-ink:#0e1520; }

body{ background:var(--ui-bg); color:var(--ui-ink); font-family:"IBM Plex Sans",system-ui,sans-serif; }
.wrap{ max-width:1080px; margin:0 auto; padding-inline:16px; padding-block:20px 48px; }
.intro{ display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
.intro h1{ font-size:1.35rem; margin:0; text-wrap:balance; }
.intro p{ margin:0; color:var(--ui-muted); max-width:70ch; line-height:1.5; }
.tabs{ display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:16px; scrollbar-width:thin; }
.tab{ flex:0 0 auto; border:1px solid var(--ui-line); background:var(--ui-surface); color:var(--ui-ink); border-radius:8px; padding:8px 12px; font:inherit; font-size:.85rem; cursor:pointer; text-align:left; display:flex; flex-direction:column; gap:2px; }
.tab small{ color:var(--ui-muted); font-size:.74rem; }
.tab[aria-selected="true"]{ background:var(--ui-accent); color:var(--ui-accent-ink); border-color:var(--ui-accent); }
.tab[aria-selected="true"] small{ color:inherit; opacity:.85; }
.tab:focus-visible{ outline:2px solid var(--ui-accent); outline-offset:2px; }
.meta{ display:flex; flex-wrap:wrap; gap:8px 16px; align-items:baseline; margin-bottom:10px; font-size:.85rem; color:var(--ui-muted); }
.meta b{ color:var(--ui-ink); }
.frame{ border:1px solid var(--ui-line); border-radius:12px; overflow:hidden; box-shadow:0 6px 24px rgba(10,20,40,.08); }
.urlbar{ background:var(--ui-surface); border-bottom:1px solid var(--ui-line); padding:8px 12px; display:flex; gap:10px; align-items:center; font-family:"IBM Plex Mono",monospace; font-size:.78rem; color:var(--ui-muted); }
.urlbar i{ display:inline-flex; gap:5px; }
.urlbar i span{ width:9px; height:9px; border-radius:50%; background:var(--ui-line); display:block; }
.urlbar .u{ background:var(--ui-bg); border-radius:6px; padding:3px 10px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; flex:1; }

/* ---------- portfolio base ---------- */
.pf{ --bg:#fff; --ink:#111; --muted:#555; --line:#ddd; --accent:#333; --soft:#f3f3f3; --chip:#eee; --display:system-ui; --body:system-ui; --mono:ui-monospace,monospace;
  background:var(--bg); color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.55; }
.pf a{ color:inherit; }
.pf h2{ font-family:var(--display); font-size:.78rem; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); margin:0 0 12px; font-weight:700; }
.pf .sec{ padding:28px clamp(18px,4vw,44px); border-top:1px solid var(--line); }
.pf .hero{ padding:40px clamp(18px,4vw,44px) 32px; display:flex; gap:22px; align-items:center; flex-wrap:wrap; }
.pf .mono-av{ width:76px; height:76px; border-radius:18px; background:var(--accent); color:var(--bg); display:grid; place-items:center; font-family:var(--display); font-weight:700; font-size:1.7rem; flex:0 0 auto; }
.pf .who{ display:flex; flex-direction:column; gap:4px; min-width:0; flex:1 1 280px; }
.pf .name{ font-family:var(--display); font-size:clamp(1.7rem,4vw,2.4rem); line-height:1.1; margin:0; text-wrap:balance; }
.pf .role{ font-weight:600; color:var(--accent); margin:0; }
.pf .tag{ color:var(--muted); margin:4px 0 0; max-width:60ch; }
.pf .badge{ display:inline-flex; align-self:flex-start; gap:6px; align-items:center; font-size:.78rem; font-weight:600; padding:4px 10px; border-radius:999px; background:var(--soft); color:var(--ink); border:1px solid var(--line); margin-top:8px; }
.pf .about{ max-width:65ch; margin:0; }
.pf .chips{ display:flex; flex-wrap:wrap; gap:8px; margin:0; padding:0; list-style:none; }
.pf .chips li{ background:var(--chip); border-radius:6px; padding:4px 10px; font-family:var(--mono); font-size:.8rem; }
.pf .projects{ display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; }
.pf .card{ background:var(--soft); border:1px solid var(--line); border-radius:12px; padding:18px; display:flex; flex-direction:column; gap:10px; }
.pf .card h3{ font-family:var(--display); font-size:1.08rem; margin:0; line-height:1.3; }
.pf .kv{ display:grid; grid-template-columns:auto 1fr; gap:4px 10px; margin:0; font-size:.9rem; }
.pf .kv dt{ font-weight:600; color:var(--muted); }
.pf .kv dd{ margin:0; }
.pf .card .chips li{ background:var(--bg); font-size:.74rem; }
.pf .link{ font-family:var(--mono); font-size:.78rem; color:var(--accent); overflow-wrap:anywhere; margin-top:auto; }
.pf.split .side .hero{ position:sticky; top:24px; }
.pf .list{ margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:8px; }
.pf .list li{ display:flex; gap:12px; flex-wrap:wrap; justify-content:space-between; border-bottom:1px dashed var(--line); padding-bottom:8px; }
.pf .list li span:last-child{ color:var(--muted); font-variant-numeric:tabular-nums; }
.pf .contact{ display:flex; flex-wrap:wrap; gap:10px; }
.pf .btn{ display:inline-flex; align-items:center; padding:10px 16px; border-radius:8px; background:var(--accent); color:var(--bg); font-weight:600; font-size:.9rem; text-decoration:none; }
.pf .btn.ghost{ background:transparent; color:var(--ink); border:1px solid var(--line); }
.pf .extra{ background:var(--soft); border-radius:12px; padding:18px; border:1px solid var(--line); }
.pf .extra ol{ margin:8px 0 0; padding-left:20px; display:grid; gap:4px; }
.pf pre{ font-family:var(--mono); font-size:.78rem; line-height:1.45; margin:8px 0 0; overflow-x:auto; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:12px; color:var(--ink); }
.pf .langs{ display:flex; gap:6px; }
.pf .langs button{ font:inherit; font-size:.78rem; font-weight:600; padding:4px 10px; border-radius:6px; border:1px solid var(--line); background:transparent; color:var(--ink); cursor:pointer; }
.pf .langs button[aria-pressed="true"]{ background:var(--accent); color:var(--bg); border-color:var(--accent); }
.pf .foot{ padding:18px clamp(18px,4vw,44px); font-size:.78rem; color:var(--muted); border-top:1px solid var(--line); }

/* split layout */
.pf.split{ display:grid; grid-template-columns:minmax(230px,300px) 1fr; }
.pf.split .side{ background:var(--accent); color:var(--bg); padding:36px 26px; display:flex; flex-direction:column; gap:14px; }
.pf.split .side .mono-av{ background:var(--bg); color:var(--accent); }
.pf.split .side .role,.pf.split .side .tag{ color:inherit; opacity:.92; }
.pf.split .side .badge{ background:transparent; color:inherit; border-color:currentColor; }
.pf.split .side .hero{ padding:0; flex-direction:column; align-items:flex-start; }
.pf.split .main .sec:first-child{ border-top:0; }
@media (max-width:720px){ .pf.split{ grid-template-columns:1fr; } }

   tag:"Tres años construyendo interfaces claras y rápidas. Ahora, además, estudiando Ingeniería Informática.",
   about:"Técnica superior en Desarrollo de Aplicaciones Web y en Sistemas Microinformáticos y Redes. Llevo unos tres años trabajando como desarrolladora front y he retomado el grado en Ingeniería Informática.",
   stack:["React","TypeScript","JavaScript","HTML","CSS / Sass","Git","Accesibilidad web"],
   projects:[
    {t:"Panel de gestión para logística", p:"Proyecto de empresa, contado sin código propiedad del cliente.", d:"Desarrollé las pantallas de seguimiento de envíos y los filtros de búsqueda, y reduje el tiempo de carga de la vista principal.", s:["React","TypeScript","API REST"], l:"—"},
    {t:"Gestor de tareas colaborativo", p:"Proyecto del grado: organizar trabajos en grupo sin perder el hilo.", d:"Desarrollé el front completo, con tablero de tareas, asignación por persona y modo oscuro.", s:["React","Node.js","GitHub Actions"], l:"github.com/sara-menendez/gestor-tareas"}],
   edu:[["Grado en Ingeniería Informática (en curso)","—"],["CFGS Desarrollo de Aplicaciones Web","2023"],["CFGS Sistemas Microinformáticos y Redes","—"]],
   note:"Lo que aporta el ejemplo: diferencia entre el trabajo de empresa (descrito) y el personal (con código visible)." }
];

let current = P[0], lang = "es";
const tx = v => (v && typeof v === "object" && !Array.isArray(v)) ? (v[lang] ?? v.es) : v;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const L = { es:{about:"Sobre mí",stack:"Tecnologías",proj:"Proyectos",prob:"Problema",did:"Qué hice",edu:"Formación y certificaciones",contact:"Contacto",nolink:"Proyecto de empresa: sin enlace público"}, en:{about:"About me",stack:"Tech stack",proj:"Projects",prob:"Problem",did:"What I did",edu:"Education and certifications",contact:"Contact",nolink:"Company project: no public link"} };

function render(){
  const p = current, t = L[p.bilingual ? lang : "es"];
  if(!p.bilingual) lang = "es";
  const hero = `
    <div class="hero">
      <div class="mono-av" aria-hidden="true">${p.ini}</div>
      <div class="who">
        <h1 class="name">${esc(p.name)}</h1>
        <p class="role">${esc(tx(p.role))}</p>
        <p class="tag">${esc(tx(p.tag))}</p>
        ${p.badge ? `<span class="badge">✓ ${esc(p.badge)}</span>` : ""}
        ${p.bilingual ? `<div class="langs" role="group" aria-label="Idioma"><button type="button" data-lang="es" aria-pressed="${lang==="es"}">ES</button><button type="button" data-lang="en" aria-pressed="${lang==="en"}">EN</button></div>` : ""}
      </div>
    </div>`;
  const cards = p.projects.map(pr => `
    <article class="card">
      <h3>${esc(tx(pr.t))}</h3>
      <dl class="kv"><dt>${t.prob}</dt><dd>${esc(tx(pr.p))}</dd><dt>${t.did}</dt><dd>${esc(tx(pr.d))}</dd></dl>
      <ul class="chips">${pr.s.map(s=>`<li>${esc(s)}</li>`).join("")}</ul>
      <span class="link">${pr.l === "—" ? t.nolink : "↗ " + esc(pr.l)}</span>
    </article>`).join("");
  const extra = p.extra ? `<div class="sec"><div class="extra"><strong>${esc(p.extra.title)}</strong>${p.extra.list ? `<ol>${p.extra.list.map(i=>`<li>${esc(i)}</li>`).join("")}</ol>` : ""}${p.extra.pre ? `<pre>${esc(p.extra.pre)}</pre>` : ""}</div></div>` : "";
  const body = `
    <div class="sec"><h2>${t.about}</h2><p class="about">${esc(tx(p.about))}</p></div>
    <div class="sec"><h2>${t.stack}</h2><ul class="chips">${p.stack.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></div>
    <div class="sec"><h2>${t.proj}</h2><div class="projects">${cards}</div></div>
    ${extra}
    <div class="sec"><h2>${t.edu}</h2><ul class="list">${p.edu.map(e=>`<li><span>${esc(tx(e[0]))}</span><span>${e[1]}</span></li>`).join("")}</ul></div>
    <div class="sec"><h2>${t.contact}</h2><div class="contact"><span class="btn">LinkedIn · linkedin.com/in/${p.user}</span><span class="btn ghost">${p.user}@correo-ejemplo.es</span></div></div>
    <div class="foot">© 2026 ${esc(p.name)} · Web publicada con GitHub Pages</div>`;
  const html = p.layout === "split"
    ? `<div class="pf split ${p.theme}"><aside class="side">${hero}</aside><div class="main">${body}</div></div>`
    : `<div class="pf ${p.theme}">${hero}${body}</div>`;
  document.getElementById("stage").innerHTML = html;
  document.getElementById("url").textContent = `https://${p.user}.github.io`;
  document.getElementById("meta").innerHTML = `<span><b>ID ${p.id}</b> · ${esc(p.tabRole)}</span><span>${esc(p.note)}</span>`;
  document.querySelectorAll("#stage [data-lang]").forEach(b => b.onclick = () => { lang = b.dataset.lang; render(); });
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.key === p.key));
}

const tabs = document.getElementById("tabs");
P.forEach(p => {
  const b = document.createElement("button");
  b.className = "tab"; b.type = "button"; b.setAttribute("role","tab"); b.dataset.key = p.key;
  b.innerHTML = `<span>ID ${p.id}</span><small>${esc(p.tabRole)}</small>`;
  b.onclick = () => { current = p; lang = "es"; render(); try{ history.replaceState(null,"","#id"+p.id); }catch(e){} };
  tabs.appendChild(b);
});
const h = (location.hash || "").replace("#id","");
current = P.find(p => p.id === h) || P[0];
render();
</script>

</body></html>
